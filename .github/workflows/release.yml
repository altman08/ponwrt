name: Release PonWrt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - an7581
          - an7583

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure ${{ matrix.target }}
        run: |
          ./scripts/kconfig.pl + \
            "configs/${{ matrix.target }}.config" \
            configs/release.config > .config
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }} with prebuilt APKs
        run: |
          set -euo pipefail

          run_make() {
            local target="$1"
            shift
            if make -j"$(nproc)" "$target" "$@"; then
              return 0
            fi
            echo "::group::Detailed $target failure log"
            make -j1 V=s "$target" "$@" || true
            echo "::endgroup::"
            return 1
          }

          download_apk() {
            local pkg="$1"
            local name="${pkg%%-[0-9]*}"
            local output="bin/packages/aarch64_cortex-a53/packages/${pkg%_openwrt-aarch64_cortex-a53.apk}.apk"
            if find bin/packages bin/targets -name "${name}-*.apk" -print -quit | grep -q .; then
              echo "::error::${name} already has a locally built APK; refusing duplicate packages"
              return 1
            fi
            curl --fail --location --retry 3 --remove-on-error --output "$output" \
              "${2:-https://github.com/altman08/ponwrt/releases/download/prebuild-package/$pkg}"
            test -s "$output"
          }

          run_make prepare
          run_make package/compile

          grep -qx 'CONFIG_USE_APK=y' .config
          grep -qx 'CONFIG_TARGET_ARCH_PACKAGES="aarch64_cortex-a53"' .config
          # CONFIG_PER_FEED_REPO=y: package/install indexes feed directories, not bin/packages/ itself.
          mkdir -p bin/packages/aarch64_cortex-a53/packages
          download_apk homebox-2026.08.04-r1_openwrt-aarch64_cortex-a53.apk
          download_apk webd-2026.09.28-r1_openwrt-aarch64_cortex-a53.apk
          download_apk luci-app-homebox-0.260929.30464_openwrt-aarch64_cortex-a53.apk
          download_apk luci-app-webd-1.3-r2_openwrt-aarch64_cortex-a53.apk

          run_make package/install PREBUILT_APK_PACKAGES='homebox webd luci-app-homebox luci-app-webd'
          run_make target/install
          run_make package/index
          run_make json_overview_image_info
          run_make checksum

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.target }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect ${{ matrix.target }} ROM images
        run: |
          mkdir release
          find "bin/targets/airoha/${{ matrix.target }}" -maxdepth 1 -type f \
            ! -name 'sha256sums' \
            ! -name '*.buildinfo' \
            ! -name 'profiles.json' \
            -exec cp -t release {} +
          test -n "$(find release -maxdepth 1 -type f -print -quit)"

      - name: Upload ${{ matrix.target }} ROM images
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download ROM images
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: |
          find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > sha256sums

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
