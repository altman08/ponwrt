name: Release PonWrt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      an7581:
        description: Build AN7581 (select at least one SoC)
        type: boolean
        default: true
      an7583:
        description: Build AN7583 (select at least one SoC)
        type: boolean
        default: false
      recovery:
        description: Build recovery.itb images
        type: boolean
        default: false
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean
      use_staging_cache:
        description: Reuse and automatically update the staging cache
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate inputs and select targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Require at least one SoC
        id: targets
        env:
          BUILD_AN7581: ${{ inputs.an7581 }}
          BUILD_AN7583: ${{ inputs.an7583 }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          targets = [
              target for target in ("an7581", "an7583")
              if os.environ[f"BUILD_{target.upper()}"] == "true"
          ]
          if not targets:
              print("::error::Select at least one SoC: AN7581 or AN7583.")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"targets={json.dumps(targets)}\n")
          PY

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    permissions:
      contents: write
      actions: write
    # Serialize each SoC across releases so cache uploads and pruning cannot race.
    concurrency:
      group: ponwrt-build-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: bash scripts/ci-build-dependencies.sh

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ matrix.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ matrix.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure ${{ matrix.target }}
        env:
          BUILD_RECOVERY: ${{ inputs.recovery }}
        run: |
          ./scripts/kconfig.pl + \
            "configs/${{ matrix.target }}.config" \
            configs/release.config > .config
          if [ "$BUILD_RECOVERY" != true ]; then
            sed -i 's/^CONFIG_TARGET_ROOTFS_INITRAMFS=y$/# CONFIG_TARGET_ROOTFS_INITRAMFS is not set/' .config
          fi
          make defconfig

      - name: Generate staging cache key
        id: cache-key
        if: inputs.use_staging_cache
        run: python3 scripts/staging-cache.py fingerprint

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Restore staging archive from Actions
        id: cache_restore
        if: inputs.use_staging_cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .staging-cache
          key: ${{ steps.cache-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache-key.outputs.key }}-

      - name: Restore and verify staging cache
        id: staging
        if: inputs.use_staging_cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/staging-cache.py restore --release

      - name: Build missing host tools, toolchain, Go and Rust
        id: cache_build
        if: inputs.use_staging_cache && steps.staging.outputs.restored != 'true'
        continue-on-error: true
        run: python3 scripts/staging-cache.py build

      - name: Pack verified staging cache
        id: cache_pack
        if: inputs.use_staging_cache && steps.cache_build.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/staging-cache.py pack

      - name: Save staging archive to Actions
        id: cache_save
        if: >-
          inputs.use_staging_cache
          && (steps.staging.outputs.restored == 'true' || steps.cache_pack.outcome == 'success')
          && steps.staging.outputs.source != 'actions'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .staging-cache
          key: ${{ steps.cache-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save latest staging cache to Release
        id: cache_publish
        if: >-
          inputs.use_staging_cache
          && (steps.staging.outputs.restored == 'true' || steps.cache_pack.outcome == 'success')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/staging-cache.py publish

      - name: Keep only the latest Actions staging cache for this SoC
        if: >-
          inputs.use_staging_cache
          && (steps.staging.outputs.source == 'actions' || steps.cache_save.outcome == 'success')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_KEY: ${{ steps.staging.outputs.source == 'actions' && steps.cache_restore.outputs.cache-matched-key || format('{0}-{1}-{2}', steps.cache-key.outputs.key, github.run_id, github.run_attempt) }}
        run: python3 scripts/staging-cache.py prune-actions --keep-key "$KEEP_KEY"

      - name: Staging cache summary
        if: always() && inputs.use_staging_cache
        env:
          CACHE_KEY: ${{ steps.cache-key.outputs.key }}
          RESTORED: ${{ steps.staging.outputs.restored || 'false' }}
          SOURCE: ${{ steps.staging.outputs.source || 'none' }}
          REBUILT: ${{ steps.cache_build.outcome == 'success' }}
          PUBLISHED: ${{ steps.cache_publish.outputs.published || 'false' }}
        run: |
          {
            echo "### Staging cache: ${{ matrix.target }}"
            echo "- Key: \`$CACHE_KEY\`"
            echo "- Restored: $RESTORED ($SOURCE)"
            echo "- Rebuilt: $REBUILT"
            echo "- Release backup available: $PUBLISHED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build ${{ matrix.target }} with prebuilt APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_make() {
            local target="$1"
            shift
            if make -j"$(nproc)" "$target" "$@"; then
              return 0
            fi
            echo "::group::Detailed $target failure log"
            make -j1 V=s "$target" "$@" || true
            echo "::endgroup::"
            return 1
          }

          download_apk() {
            local pkg="$1"
            local name="${pkg%%-[0-9]*}"
            local filename="${pkg%.apk}"
            filename="${filename%_openwrt-aarch64_cortex-a53}"
            filename="${filename%_aarch64_cortex-a53}"
            local output="bin/packages/aarch64_cortex-a53/packages/${filename}.apk"
            if find bin/packages bin/targets -name "${name}-*.apk" -print -quit | grep -q .; then
              echo "::error::${name} already has a locally built APK; refusing duplicate packages"
              return 1
            fi
            printf 'Downloading APK: %s\n' "$pkg"
            curl --silent --show-error --fail --location --retry 3 --remove-on-error --output "$output" \
              "${2:-https://github.com/altman08/ponwrt/releases/download/prebuild-package/$pkg}"
            test -s "$output"
            printf 'Download completed: %s\n' "$pkg"
          }

          run_make prepare
          run_make package/compile

          grep -qx 'CONFIG_USE_APK=y' .config
          grep -qx 'CONFIG_TARGET_ARCH_PACKAGES="aarch64_cortex-a53"' .config
          # CONFIG_PER_FEED_REPO=y: package/install indexes feed directories, not bin/packages/ itself.
          mkdir -p bin/packages/aarch64_cortex-a53/packages
          release_id="$(gh api repos/altman08/ponwrt/releases/tags/prebuild-package --jq '.id')"
          # Sort all pages together: regular packages, LuCI apps, then translations.
          apk_list="$(gh api --paginate "repos/altman08/ponwrt/releases/$release_id/assets?per_page=100" |
            jq -sr '[.[][] | select(.name | endswith(".apk")) | .name] |
              sort_by(if startswith("luci-i18n-") then 2 elif startswith("luci-app-") then 1 else 0 end, .) | .[]')"
          if [ -z "$apk_list" ]; then
            echo "::error::No APK assets found in the prebuild-package release"
            exit 1
          fi
          prebuilt_packages=()
          while IFS= read -r pkg; do
            download_apk "$pkg"
            prebuilt_packages+=("${pkg%%-[0-9]*}")
          done <<< "$apk_list"

          run_make package/install "PREBUILT_APK_PACKAGES=${prebuilt_packages[*]}"
          run_make target/install
          run_make package/index
          run_make json_overview_image_info
          run_make checksum

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.target }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect ${{ matrix.target }} ROM images
        run: |
          mkdir release
          find "bin/targets/airoha/${{ matrix.target }}" -maxdepth 1 -type f \
            ! -name 'sha256sums' \
            ! -name '*.buildinfo' \
            ! -name 'profiles.json' \
            -exec cp -t release {} +
          test -n "$(find release -maxdepth 1 -type f -print -quit)"

      - name: Upload ${{ matrix.target }} ROM images
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download ROM images
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: |
          find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > sha256sums

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
